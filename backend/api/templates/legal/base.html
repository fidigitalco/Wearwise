<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · WearWise AI</title>
<style>
  :root { --bg: #FBF9F4; --text: #242722; --muted: #5b6153; --accent: #A65E3E; --line: #e4ded2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1f1b; --text: #F1EFE9; --muted: #b5b8ad; --accent: #D49A7C; --line: #34372f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 34px; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 22px; margin: 32px 0 8px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  a { color: var(--accent); }
  ul, ol { padding-left: 22px; }
  li { margin: 4px 0; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 16px 0; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
<footer>WearWise AI · <a href="/privacy/">Privacy policy</a> · <a href="/delete-account/">Delete your account</a></footer>
</main>
</body>
</html>
